<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

    <style>
        #toolbox {
            background-color: #b4b4b4;
            padding: 10px;
        }
        #main {
            padding: 10px;
        }

        #tools {
            display: flex;
            flex-direction: row;
            align-items: center;
        }

        #tools button {
            width: 4em;
            height: 4em;
            margin-right: 2em;
        }
    </style>
</head>
<body>
    <section id="toolbox">
        <div id="tools">
            <button>
                <i class="fa-solid fa-lock"></i>
            </button>
        </div>
    </section>
    <section id="main">

    </section>
</body>
</html>
